[project]
name = "sketchup-mcp2"
version = "0.3.1"
description = "Sketchup integration through Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Alexander V. Zinin", email = "mail@zinin.ru"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    # Floor 1.30 = новейший 1.x и первый, против которого тестирует CI.
    # <2: mcp 2.x ломает import surface; миграция на 2.x — отдельный тикет.
    # Extra [cli] убран: typer/rich нигде не импортируются.
    "mcp>=1.30,<2",
    # tools.py импортирует pydantic напрямую. 2.11 — собственный floor mcp 1.30
    # для Python < 3.14 (на 3.14 mcp сам требует 2.12, резолвер это учитывает).
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/zinin/sketchup-mcp2"
Issues = "https://github.com/zinin/sketchup-mcp2/issues"
Upstream = "https://github.com/mhyrr/sketchup-mcp"

[project.scripts]
sketchup-mcp2 = "sketchup_mcp.server:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

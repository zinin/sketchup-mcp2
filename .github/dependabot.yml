version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Conventional Commits: without a prefix Dependabot titles its commits
    # "Bump ...", outside the convention of the rest of the history.
    commit-message:
      prefix: "build"
    ignore:
      # mcp 2.x breaks the import surface; the migration is a separate ticket.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

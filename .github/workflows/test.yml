name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          # SketchUp 2024/2025 несут Ruby 3.2.x; для SU2026 то же семейство.
          ruby-version: '3.2'
      # test_package_output.rb требует rubyzip (не stdlib);
      # Gemfile в проекте нет намеренно (см. deep-research T-20).
      # Пин мажора: локально верифицирован rubyzip 3.x; неожиданный мажорный
      # релиз гема не должен красить CI без отношения к коду проекта.
      - run: gem install rubyzip -v '~> 3'
      - run: ruby test/run_all.rb

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 — заявленный requires-python floor: CI обязан тестировать минимум.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # --locked падает, если uv.lock рассинхронизирован с pyproject.toml;
      # --frozen молча поставил бы устаревший lock.
      - run: uv sync --locked --extra dev
      - run: uv run --locked pytest tests/ -q
